<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyChat — One prompt, all models</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --surface-2: #18181f;
      --surface-3: #222230;
      --border:    #2a2a3c;
      --text:      #e8e8f2;
      --text-2:    #8888aa;
      --text-3:    #4a4a6a;
      --claude:    #d4773b;
      --gemini:    #4285f4;
      --openai:    #10a37f;
      --consensus: #9333ea;
      --radius:    12px;
      --radius-sm: 8px;
    }
    [data-theme="light"] {
      --bg:        #f4f4fb;
      --surface:   #ffffff;
      --surface-2: #ebebf5;
      --surface-3: #e0e0ee;
      --border:    #d0d0e4;
      --text:      #111120;
      --text-2:    #55556e;
      --text-3:    #9090b0;
    }
    [data-theme="light"] #hljs-theme { display: none; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; transition: background .2s, color .2s;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px); gap: 8px;
    }
    .logo { font-size: 16px; font-weight: 700; letter-spacing: -.4px; white-space: nowrap; }
    .logo-grad {
      background: linear-gradient(120deg, var(--claude) 0%, var(--gemini) 50%, var(--openai) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-ver { font-size: 10px; font-weight: 400; color: var(--text-3); letter-spacing: 0; margin-left: 4px; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      height: 32px; min-width: 32px;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      background: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-2); cursor: pointer; transition: all .15s;
      font-family: inherit; font-size: 12px; font-weight: 600; padding: 0 10px;
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn svg { pointer-events: none; flex-shrink: 0; }
    .icon-btn.icon-only { padding: 0; width: 32px; }

    /* ── App shell ──────────────────────────────────────────────────── */
    .app {
      max-width: 1100px; margin: 0 auto;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
    }

    .no-config-hint { font-size: 13px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
    .no-config-hint button {
      background: none; border: none; color: var(--gemini);
      font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline;
    }

    /* ── Prompt area ────────────────────────────────────────────────── */
    .prompt-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; transition: border-color .15s;
    }
    .prompt-card:focus-within { border-color: var(--text-3); }
    .prompt-input {
      width: 100%; background: none; border: none;
      color: var(--text); font-family: inherit; font-size: 14px; line-height: 1.6;
      padding: 14px; resize: none; min-height: 90px; outline: none;
    }
    .prompt-input::placeholder { color: var(--text-3); font-size: 13px; }
    .prompt-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-top: 1px solid var(--border); gap: 10px;
    }
    .prompt-targets { font-size: 11px; color: var(--text-3); flex: 1; }
    .send-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--text); color: var(--bg); border: none;
      border-radius: var(--radius-sm); padding: 8px 16px;
      font-family: inherit; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: opacity .15s; white-space: nowrap;
    }
    .send-btn:hover { opacity: .82; }
    .send-btn:disabled { opacity: .35; cursor: not-allowed; }
    .send-btn kbd { font-family: inherit; font-size: 10px; opacity: .55; font-weight: 400; }

    /* ── Response panel ─────────────────────────────────────────────── */
    .responses {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .tab-bar {
      display: flex; overflow-x: auto; scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    /* ── Tabs — two-line layout with embedded model selector ─────────── */
    .tab {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      font-family: inherit; background: none; border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer; color: var(--text-2); white-space: nowrap; flex-shrink: 0;
      transition: color .15s, border-color .15s;
      text-align: left;
    }
    .tab.active { color: var(--text); }

    .tab-dot {
      width: 7px; height: 7px; border-radius: 50%;
      flex-shrink: 0; position: relative;
    }
    .tab-dot.loading::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      border: 2px solid var(--dot-c, #888); border-top-color: transparent;
      -webkit-animation: tab-spin .65s linear infinite;
      animation: tab-spin .65s linear infinite;
    }
    @-webkit-keyframes tab-spin { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(360deg); } }
    @keyframes tab-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .tab-dot.done {
      -webkit-animation: pop .35s cubic-bezier(.36,.07,.19,.97);
      animation: pop .35s cubic-bezier(.36,.07,.19,.97);
    }
    @-webkit-keyframes pop { 0% { -webkit-transform: scale(1); } 40% { -webkit-transform: scale(1.6); } 100% { -webkit-transform: scale(1); } }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.6); } 100% { transform: scale(1); } }

    /* Two-line tab label */
    .tab-label { display: flex; flex-direction: column; gap: 2px; }
    .tab-name  { font-size: 12px; font-weight: 600; line-height: 1; }

    /* Model selector row inside tab */
    .tab-model-wrap {
      position: relative; display: inline-flex; align-items: center; gap: 2px;
    }
    .tab-model {
      font-size: 9px; color: var(--text-3); line-height: 1;
      pointer-events: none; /* clicks fall through to the select */
    }
    .tab-chevron { font-size: 7px; color: var(--text-3); pointer-events: none; }
    /* Invisible select sits over the model name */
    .tab-model-select {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
      width: 100%; height: 100%; border: none; background: none;
    }
    /* Consensus step text — same slot, no select */
    .tab-step { font-size: 9px; color: var(--text-3); line-height: 1; min-height: 10px; }

    /* ── Conversation ───────────────────────────────────────────────── */
    .tab-panel { display: none; flex-direction: column; }
    .tab-panel.active { display: flex; }
    .conversation {
      flex: 1; overflow-y: auto;
      padding: 16px; display: flex; flex-direction: column; gap: 0;
      height: min(560px, calc(100vh - 320px)); min-height: 260px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .conversation::-webkit-scrollbar { width: 4px; }
    .conversation::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .qa-pair { display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }
    .qa-pair + .qa-pair { border-top: 1px solid var(--border); padding-top: 16px; }

    .msg { display: flex; flex-direction: column; gap: 3px; }
    .msg.user { align-items: flex-end; }
    .msg-label { font-size: 10px; color: var(--text-3); font-weight: 600; padding: 0 4px; text-transform: uppercase; letter-spacing: .4px; }
    .msg-bubble {
      max-width: 90%; padding: 10px 14px;
      font-size: 14px; line-height: 1.65; border-radius: var(--radius);
    }
    .msg.user .msg-bubble {
      background: var(--surface-3);
      border-radius: var(--radius) var(--radius) 4px var(--radius);
    }
    .msg.assistant .msg-bubble {
      background: var(--surface-2);
      border-radius: var(--radius) var(--radius) var(--radius) 4px;
    }
    .msg.assistant .msg-bubble p { margin-bottom: .7em; }
    .msg.assistant .msg-bubble p:last-child { margin-bottom: 0; }
    .msg.assistant .msg-bubble pre {
      background: #0d1117; padding: 12px 14px; border-radius: 8px;
      overflow-x: auto; margin: 10px 0; font-size: 13px;
    }
    .msg.assistant .msg-bubble code:not(pre code) {
      background: var(--surface-3); padding: 2px 5px; border-radius: 4px;
      font-size: .9em; font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .msg.assistant .msg-bubble pre code { background: none; padding: 0; font-size: inherit; }
    .msg.assistant .msg-bubble h1,
    .msg.assistant .msg-bubble h2,
    .msg.assistant .msg-bubble h3 { margin: .8em 0 .4em; font-size: 1em; font-weight: 700; }
    .msg.assistant .msg-bubble ul,
    .msg.assistant .msg-bubble ol { padding-left: 1.4em; margin: .5em 0; }
    .msg.assistant .msg-bubble li { margin-bottom: .3em; }
    .msg.assistant .msg-bubble blockquote {
      border-left: 3px solid var(--border); padding-left: 12px; color: var(--text-2); margin: .5em 0;
    }
    .msg.assistant .msg-bubble table {
      border-collapse: collapse; width: 100%; margin: .8em 0; font-size: 13px;
    }
    .msg.assistant .msg-bubble th,
    .msg.assistant .msg-bubble td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
    .msg.assistant .msg-bubble th { background: var(--surface-3); font-weight: 600; }
    .msg-error { color: #f87171; font-size: 13px; }

    .loading-dots { display: flex; gap: 4px; padding: 6px 2px; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--text-3);
      -webkit-animation: bounce-dot 1.2s ease-in-out infinite;
      animation: bounce-dot 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce-dot { 0%, 80%, 100% { transform: scale(.75); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }

    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; color: var(--text-3); font-size: 13px; padding: 40px 0;
    }
    .empty-icon { font-size: 28px; opacity: .3; }

    /* ── Config modal ───────────────────────────────────────────────── */
    .backdrop {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.65); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); width: 100%; max-width: 500px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--surface);
    }
    .modal-title { font-size: 14px; font-weight: 700; }
    .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 24px; }
    .svc-section { display: flex; flex-direction: column; gap: 12px; }
    .svc-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
    .svc-dot { width: 9px; height: 9px; border-radius: 50%; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 10px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .5px; }
    .field-input {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px;
      padding: 8px 12px; width: 100%; outline: none; transition: border-color .15s;
    }
    select.field-input { font-family: inherit; cursor: pointer; }
    .field-input:focus { border-color: var(--text-2); }
    .field-hint { font-size: 11px; color: var(--text-3); }
    .field-hint a { color: var(--text-2); }
    .security-note {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 11px 13px;
      font-size: 12px; color: var(--text-2); line-height: 1.5;
    }
    .modal-foot {
      display: flex; gap: 8px; justify-content: space-between;
      padding: 12px 18px; border-top: 1px solid var(--border);
      position: sticky; bottom: 0; background: var(--surface);
    }
    .btn { border-radius: var(--radius-sm); font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; cursor: pointer; transition: all .15s; border: 1px solid; }
    .btn-ghost { background: none; border-color: var(--border); color: var(--text-2); }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .btn-danger { background: none; border-color: transparent; color: #f87171; }
    .btn-danger:hover { background: rgba(248,113,113,.1); }
    .btn-solid { background: var(--text); border-color: transparent; color: var(--bg); }
    .btn-solid:hover { opacity: .85; }

    /* ── Toast ──────────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--text); color: var(--bg);
      padding: 8px 16px; border-radius: 100px;
      font-size: 13px; font-weight: 500; z-index: 400;
      opacity: 0; transition: all .25s; white-space: nowrap; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .app { padding: 10px; gap: 10px; }
      header { padding: 10px 12px; }
      .conversation { height: min(400px, calc(100vh - 290px)); }
      .msg-bubble { max-width: 98%; font-size: 13px; }
      .send-btn kbd { display: none; }
      .modal-body { padding: 14px; gap: 20px; }
      .tab { padding: 7px 10px; gap: 5px; }
    }
  </style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────────────────── -->
<header>
  <div class="logo">Poly<span class="logo-grad">Chat</span><span class="logo-ver">v2026-06-04 20:30</span></div>
  <div class="header-actions">
    <button class="icon-btn" id="resetBtn" title="New chat">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.39"/>
      </svg>
      New chat
    </button>
    <button class="icon-btn icon-only" id="themeBtn" title="Toggle theme">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button class="icon-btn icon-only" id="configBtn" title="API configuration">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</header>

<!-- ── App ──────────────────────────────────────────────────────────── -->
<div class="app">
  <div class="prompt-card">
    <textarea class="prompt-input" id="promptInput"
      placeholder="Type your prompt — sent to all configured models simultaneously&#10;&#10;⌘↵ or Ctrl↵ to send"></textarea>
    <div class="prompt-footer">
      <span class="prompt-targets" id="promptTargets"></span>
      <button class="send-btn" id="sendBtn" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        Send to all <kbd>⌘↵</kbd>
      </button>
    </div>
  </div>

  <div class="responses" id="responses" style="display:none">
    <div class="tab-bar" id="tabBar"></div>
    <div id="tabPanels"></div>
  </div>
</div>

<!-- ── Config modal ──────────────────────────────────────────────────── -->
<div class="backdrop" id="configModal">
  <div class="modal" role="dialog" aria-modal="true" aria-label="API Configuration">
    <div class="modal-head">
      <span class="modal-title">API Configuration</span>
      <button class="icon-btn icon-only" id="closeConfig">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="svc-section">
        <div class="svc-head"><div class="svc-dot" style="background:var(--claude)"></div>Claude (Anthropic)</div>
        <div class="field">
          <label class="field-label" for="claudeKey">API Key</label>
          <input type="password" class="field-input" id="claudeKey" placeholder="sk-ant-api03-…" autocomplete="off">
          <span class="field-hint">Get your key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></span>
        </div>
        <div class="field">
          <label class="field-label" for="claudeModel">Model</label>
          <select class="field-input" id="claudeModel">
            <option value="claude-opus-4-8">Claude Opus 4.8 (recommended)</option>
            <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
            <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
            <option value="claude-opus-4-7">Claude Opus 4.7</option>
            <option value="claude-sonnet-4-5-20250929">Claude Sonnet 4.5</option>
            <option value="claude-opus-4-1-20250805">Claude Opus 4.1</option>
          </select>
        </div>
      </div>
      <div class="svc-section">
        <div class="svc-head"><div class="svc-dot" style="background:var(--gemini)"></div>Gemini (Google)</div>
        <div class="field">
          <label class="field-label" for="geminiKey">API Key</label>
          <input type="password" class="field-input" id="geminiKey" placeholder="AIzaSy…" autocomplete="off">
          <span class="field-hint">Get your key at <a href="https://aistudio.google.com" target="_blank">aistudio.google.com</a></span>
        </div>
        <div class="field">
          <label class="field-label" for="geminiModel">Model</label>
          <select class="field-input" id="geminiModel">
            <option value="gemini-3.5-flash">Gemini 3.5 Flash (recommended)</option>
            <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
            <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
            <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option>
          </select>
        </div>
      </div>
      <div class="svc-section">
        <div class="svc-head"><div class="svc-dot" style="background:var(--openai)"></div>ChatGPT (OpenAI)</div>
        <div class="field">
          <label class="field-label" for="openaiKey">API Key</label>
          <input type="password" class="field-input" id="openaiKey" placeholder="sk-proj-…" autocomplete="off">
          <span class="field-hint">Get your key at <a href="https://platform.openai.com" target="_blank">platform.openai.com</a></span>
        </div>
        <div class="field">
          <label class="field-label" for="openaiModel">Model</label>
          <select class="field-input" id="openaiModel">
            <option value="gpt-5.5">GPT-5.5 (recommended)</option>
            <option value="gpt-5.4">GPT-5.4</option>
            <option value="gpt-5.4-mini">GPT-5.4 mini</option>
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-4o-mini">GPT-4o mini</option>
          </select>
        </div>
      </div>
      <div class="security-note">
        🔒 Keys are stored in your browser's <strong>localStorage</strong> and never leave your device.
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="clearConfig">Clear all keys</button>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" id="cancelConfig">Cancel</button>
        <button class="btn btn-solid" id="saveConfig">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ── Service definitions ───────────────────────────────────────────────
const SVC = {
  claude: { name: 'Claude', tabLabel: 'Claude', color: '#d4773b', openUrl: 'https://claude.ai/new' },
  gemini: { name: 'Gemini', tabLabel: 'Gemini', color: '#4285f4', openUrl: 'https://gemini.google.com/app' },
  openai: { name: 'ChatGPT', tabLabel: 'GPT',   color: '#10a37f', openUrl: 'https://chatgpt.com/' },
};

const MODEL_OPTIONS = {
  claude: [
    { value: 'claude-opus-4-8',           label: 'Opus 4.8'   },
    { value: 'claude-sonnet-4-6',         label: 'Sonnet 4.6' },
    { value: 'claude-haiku-4-5-20251001', label: 'Haiku 4.5'  },
    { value: 'claude-opus-4-7',           label: 'Opus 4.7'   },
    { value: 'claude-sonnet-4-5-20250929',label: 'Sonnet 4.5' },
    { value: 'claude-opus-4-1-20250805',  label: 'Opus 4.1'   },
  ],
  gemini: [
    { value: 'gemini-3.5-flash',          label: '3.5 Flash'  },
    { value: 'gemini-3.1-pro-preview',    label: '3.1 Pro'    },
    { value: 'gemini-3-flash-preview',    label: '3 Flash'    },
    { value: 'gemini-3.1-flash-lite',     label: '3.1 Lite'   },
    { value: 'gemini-2.5-pro',            label: '2.5 Pro'    },
    { value: 'gemini-2.5-flash',          label: '2.5 Flash'  },
    { value: 'gemini-2.5-flash-lite',     label: '2.5 Lite'   },
    { value: 'gemini-2.0-flash',          label: '2.0 Flash'  },
    { value: 'gemini-2.0-flash-lite',     label: '2.0 Lite'   },
  ],
  openai: [
    { value: 'gpt-5.5',                   label: 'GPT-5.5'    },
    { value: 'gpt-5.4',                   label: 'GPT-5.4'    },
    { value: 'gpt-5.4-mini',              label: '5.4 mini'   },
    { value: 'gpt-4o',                    label: 'GPT-4o'     },
    { value: 'gpt-4o-mini',              label: '4o mini'    },
  ],
};

function modelShort(svcId, modelValue) {
  const opt = (MODEL_OPTIONS[svcId] || []).find(o => o.value === modelValue);
  return opt ? opt.label : modelValue;
}

// ── Config ────────────────────────────────────────────────────────────
function loadCfg() {
  try { return JSON.parse(localStorage.getItem('polychat_v2') || '{}'); } catch { return {}; }
}
function saveCfg(c) { localStorage.setItem('polychat_v2', JSON.stringify(c)); }
function activeServices() {
  const c = loadCfg();
  return Object.keys(SVC).filter(id => c[id + '_key']);
}

// ── State ─────────────────────────────────────────────────────────────
const convos = { claude: [], gemini: [], openai: [] };
let lastBroadcastPrompt = '';
let broadcastResults   = {};
let completionOrder    = [];

// ── Toast ─────────────────────────────────────────────────────────────
let _toastTimer;
function toast(msg, dur = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

// ── Status ────────────────────────────────────────────────────────────
function refreshStatus() {
  const active = activeServices();
  const btn    = document.getElementById('sendBtn');
  const tgt    = document.getElementById('promptTargets');
  if (!active.length) {
    tgt.innerHTML = `<span class="no-config-hint">No services configured — <button onclick="openConfig()">add API keys ⚙</button></span>`;
    btn.disabled = true;
    return;
  }
  btn.disabled = false;
  tgt.textContent = `→ ${active.map(id => SVC[id].name).join(' · ')}`;
}

// ── Tab management ────────────────────────────────────────────────────
let activeTab = null;

function ensureTabs() {
  const services = activeServices();
  const tabBar   = document.getElementById('tabBar');
  const panels   = document.getElementById('tabPanels');
  const cfg      = loadCfg();

  services.forEach(id => {
    if (document.getElementById('tab_' + id)) return;

    const curModel = cfg[id + 'Model'] || MODEL_OPTIONS[id][0].value;
    const opts = MODEL_OPTIONS[id].map(o =>
      `<option value="${o.value}"${o.value === curModel ? ' selected' : ''}>${o.label}</option>`
    ).join('');

    const btn = document.createElement('button');
    btn.className = 'tab'; btn.id = 'tab_' + id; btn.setAttribute('data-svc', id);
    btn.onclick = () => switchTab(id);
    btn.innerHTML = `
      <span class="tab-dot" id="tdot_${id}" style="background:${SVC[id].color};--dot-c:${SVC[id].color}"></span>
      <div class="tab-label">
        <span class="tab-name">${SVC[id].tabLabel}</span>
        <div class="tab-model-wrap">
          <span class="tab-model" id="tmodel_${id}">${modelShort(id, curModel)}</span>
          <span class="tab-chevron">▾</span>
          <select class="tab-model-select"
                  onclick="event.stopPropagation()"
                  onchange="onTabModelChange('${id}', this)">${opts}</select>
        </div>
      </div>`;
    tabBar.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel'; panel.id = 'panel_' + id;
    panel.innerHTML = `
      <div class="conversation" id="conv_${id}">
        <div class="empty-state" id="empty_${id}">
          <div class="empty-icon">◎</div>
          <div>Send a prompt to see ${SVC[id].name}'s response</div>
        </div>
      </div>`;
    panels.appendChild(panel);
  });

  // Consensus tab — always last, only once
  if (!document.getElementById('tab_consensus')) {
    const btn = document.createElement('button');
    btn.className = 'tab'; btn.id = 'tab_consensus'; btn.setAttribute('data-svc', 'consensus');
    btn.onclick = () => switchTab('consensus');
    btn.innerHTML = `
      <span class="tab-dot" id="tdot_consensus" style="background:var(--consensus);--dot-c:var(--consensus)"></span>
      <div class="tab-label">
        <span class="tab-name">Consensus</span>
        <span class="tab-step" id="consensus-tab-step"></span>
      </div>`;
    tabBar.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel'; panel.id = 'panel_consensus';
    panel.innerHTML = `
      <div class="conversation" id="conv_consensus">
        <div class="empty-state" id="empty_consensus">
          <div class="empty-icon" style="font-size:26px;background:linear-gradient(135deg,var(--claude),var(--gemini),var(--openai));-webkit-background-clip:text;-webkit-text-fill-color:transparent">✦</div>
          <div id="consensus-status">Consensus will appear here after all models respond</div>
        </div>
      </div>`;
    panels.appendChild(panel);
  }

  if (!activeTab && services.length) switchTab(services[0]);
}

function onTabModelChange(svcId, sel) {
  const cfg = loadCfg();
  cfg[svcId + 'Model'] = sel.value;
  saveCfg(cfg);
  const el = document.getElementById('tmodel_' + svcId);
  if (el) el.textContent = modelShort(svcId, sel.value);
  const ms = document.getElementById(svcId + 'Model');
  if (ms) ms.value = sel.value;
}

function setConsensusTabStep(label) {
  const el = document.getElementById('consensus-tab-step');
  if (el) el.textContent = label || '';
}

function switchTab(id) {
  activeTab = id;
  const color = id === 'consensus' ? 'var(--consensus)' : SVC[id]?.color;
  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.getAttribute('data-svc') === id;
    t.classList.toggle('active', isActive);
    t.style.borderBottomColor = isActive ? color : 'transparent';
    t.style.color = isActive ? 'var(--text)' : '';
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel_' + id);
  });
}

// ── Markdown / highlight ──────────────────────────────────────────────
function renderMarkdown(text) {
  if (typeof marked === 'undefined')
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  return marked.parse(text);
}
function highlightBubble(el) {
  el.querySelectorAll('pre code').forEach(b => { if (typeof hljs !== 'undefined') hljs.highlightElement(b); });
}

// ── SSE reader ────────────────────────────────────────────────────────
async function* sseReader(response, extract) {
  const reader = response.body.getReader();
  const dec = new TextDecoder();
  let buf = '', evtName = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop() ?? '';
    for (const line of lines) {
      if (line.startsWith('event:')) { evtName = line.slice(6).trim(); }
      else if (line.startsWith('data:')) {
        const raw = line.slice(5).trim();
        if (raw === '[DONE]') return;
        try { const d = JSON.parse(raw); const c = extract(evtName, d); if (c) yield c; } catch {}
        evtName = null;
      } else if (line === '') { evtName = null; }
    }
  }
}

// ── API generators ────────────────────────────────────────────────────
async function* apiClaude(messages, cfg) {
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': cfg.claude_key, 'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true', 'content-type': 'application/json',
    },
    body: JSON.stringify({
      model: cfg.claudeModel || 'claude-opus-4-8', max_tokens: 8096, stream: true,
      messages: messages.map(m => ({ role: m.role, content: m.content })),
    }),
  });
  if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${resp.status}`); }
  yield* sseReader(resp, (_, d) => d?.type === 'content_block_delta' && d?.delta?.type === 'text_delta' ? d.delta.text : null);
}

function geminiContents(messages) {
  const merged = [];
  for (const m of messages) {
    const role = m.role === 'assistant' ? 'model' : 'user';
    if (merged.length && merged[merged.length-1].role === role)
      merged[merged.length-1].parts[0].text += '\n\n' + m.content;
    else merged.push({ role, parts: [{ text: m.content }] });
  }
  return merged;
}
async function* apiGemini(messages, cfg) {
  const model = cfg.geminiModel || MODEL_OPTIONS.gemini[0].value;
  const resp = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?key=${cfg.gemini_key}&alt=sse`,
    { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ contents: geminiContents(messages) }) }
  );
  if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${resp.status}`); }
  yield* sseReader(resp, (_, d) => d?.candidates?.[0]?.content?.parts?.[0]?.text ?? null);
}

async function* apiOpenAI(messages, cfg) {
  const resp = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'authorization': `Bearer ${cfg.openai_key}`, 'content-type': 'application/json' },
    body: JSON.stringify({
      model: cfg.openaiModel || 'gpt-5.5', stream: true,
      messages: messages.map(m => ({ role: m.role, content: m.content })),
    }),
  });
  if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${resp.status}`); }
  yield* sseReader(resp, (_, d) => d?.choices?.[0]?.delta?.content ?? null);
}

function makeGen(svcId, messages, cfg) {
  if (svcId === 'claude') return apiClaude(messages, cfg);
  if (svcId === 'gemini') return apiGemini(messages, cfg);
  return apiOpenAI(messages, cfg);
}

// ── Stream to service tab ─────────────────────────────────────────────
async function streamTo(svcId, userContent) {
  const cfg   = loadCfg();
  convos[svcId].push({ role: 'user', content: userContent });

  const conv  = document.getElementById('conv_' + svcId);
  const empty = document.getElementById('empty_' + svcId);
  if (empty) empty.remove();

  const pair = document.createElement('div');
  pair.className = 'qa-pair';
  const safe = userContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  pair.innerHTML = `
    <div class="msg user"><span class="msg-label">You</span><div class="msg-bubble">${safe}</div></div>
    <div class="msg assistant">
      <span class="msg-label">${SVC[svcId].name}</span>
      <div class="msg-bubble" id="mbubble_${svcId}">
        <div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    </div>`;
  conv.prepend(pair);
  conv.scrollTop = 0;

  const dot = document.getElementById('tdot_' + svcId);
  if (dot) dot.classList.add('loading');

  // Disable model selector during broadcast
  const sel = document.querySelector(`#tab_${svcId} .tab-model-select`);
  if (sel) sel.disabled = true;
  const chev = document.querySelector(`#tab_${svcId} .tab-chevron`);
  if (chev) chev.style.display = 'none';

  const bubble = document.getElementById('mbubble_' + svcId);
  let full = '';

  try {
    const gen = makeGen(svcId, convos[svcId], cfg);
    bubble.innerHTML = '';
    for await (const chunk of gen) {
      full += chunk;
      bubble.innerHTML = renderMarkdown(full);
    }
    if (!full) bubble.textContent = '(no response)';
    else highlightBubble(bubble);
    convos[svcId].push({ role: 'assistant', content: full });
    return full;
  } catch (err) {
    bubble.innerHTML = `<span class="msg-error">Error: ${err.message}</span>`;
    convos[svcId].pop();
    return null;
  } finally {
    if (dot) { dot.classList.remove('loading'); dot.classList.add('done'); setTimeout(() => dot.classList.remove('done'), 350); }
    // Re-enable model selector
    if (sel) sel.disabled = false;
    if (chev) chev.style.display = '';
  }
}

// ── Broadcast send ────────────────────────────────────────────────────
async function sendAll() {
  const text     = document.getElementById('promptInput').value.trim();
  if (!text) return;
  const services = activeServices();
  if (!services.length) { openConfig(); return; }

  lastBroadcastPrompt = text;
  broadcastResults    = {};
  completionOrder     = [];

  document.getElementById('promptInput').value = '';
  document.getElementById('promptInput').style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('responses').style.display = '';

  ensureTabs();

  let step1Started = false;
  let step1Promise = null;

  await Promise.allSettled(services.map(async id => {
    const result = await streamTo(id, text);
    completionOrder.push(id);
    broadcastResults[id] = result;

    if (services.length >= 3 && !step1Started) {
      const ok = completionOrder.filter(i => broadcastResults[i]);
      if (ok.length >= 2) {
        step1Started = true;
        const [f, s] = ok;
        const msgs = [
          { role: 'user',      content: text },
          { role: 'assistant', content: broadcastResults[f] },
          { role: 'user',      content: `Here is an additional perspective on this question:\n\n---\n${broadcastResults[s]}\n---\n\nBased on everything you know, provide the most complete and accurate answer possible.` },
        ];
        setConsensusTabStep(`${SVC[f].tabLabel} ↔ ${SVC[s].tabLabel}`);
        setConsensusDot(true);
        step1Promise = getSilentText(f, msgs).catch(() => broadcastResults[f]);
      }
    }
  }));

  if (!step1Started) {
    setConsensusDot(true);
  }

  await runConsensus(step1Promise);

  setConsensusDot(false);
  setConsensusTabStep('');
  document.getElementById('sendBtn').disabled = false;
}

// ── Reset ─────────────────────────────────────────────────────────────
function resetApp() {
  Object.keys(convos).forEach(id => convos[id] = []);
  lastBroadcastPrompt = '';
  broadcastResults = {};
  completionOrder  = [];

  document.querySelectorAll('.conversation').forEach(conv => {
    const svcId = conv.id.replace('conv_', '');
    const label = svcId === 'consensus'
      ? 'Consensus will appear here after all models respond'
      : `Send a prompt to see ${SVC[svcId]?.name || svcId}'s response`;
    const icon = svcId === 'consensus'
      ? `<div class="empty-icon" style="font-size:26px;background:linear-gradient(135deg,var(--claude),var(--gemini),var(--openai));-webkit-background-clip:text;-webkit-text-fill-color:transparent">✦</div>`
      : `<div class="empty-icon">◎</div>`;
    conv.innerHTML = `<div class="empty-state" id="empty_${svcId}">${icon}<div id="${svcId === 'consensus' ? 'consensus-status' : ''}">${label}</div></div>`;
  });

  document.querySelectorAll('.tab-dot').forEach(d => d.classList.remove('loading', 'done'));
  setConsensusTabStep('');

  // Re-enable all model selects and chevrons
  document.querySelectorAll('.tab-model-select').forEach(s => s.disabled = false);
  document.querySelectorAll('.tab-chevron').forEach(c => c.style.display = '');

  document.getElementById('promptInput').focus();
}

// ── Consensus helpers ─────────────────────────────────────────────────
function setConsensusStatus(msg) {
  const el = document.getElementById('consensus-status');
  if (el) el.textContent = msg;
}

function setConsensusDot(loading) {
  const dot = document.getElementById('tdot_consensus');
  if (!dot) return;
  if (loading) { dot.classList.add('loading'); }
  else { dot.classList.remove('loading'); dot.classList.add('done'); setTimeout(() => dot.classList.remove('done'), 350); }
}

async function getSilentText(svcId, messages) {
  const cfg = loadCfg();
  let text = '';
  for await (const chunk of makeGen(svcId, messages, cfg)) text += chunk;
  return text;
}

async function streamToConsensusTab(svcId, messages) {
  const cfg   = loadCfg();
  const conv  = document.getElementById('conv_consensus');
  const empty = document.getElementById('empty_consensus');
  if (empty) empty.remove();

  const safe = lastBroadcastPrompt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  const pair = document.createElement('div');
  pair.className = 'qa-pair';
  pair.innerHTML = `
    <div class="msg user"><span class="msg-label">You</span><div class="msg-bubble">${safe}</div></div>
    <div class="msg assistant">
      <span class="msg-label">Consensus</span>
      <div class="msg-bubble" id="consensus-bubble"></div>
    </div>`;
  conv.prepend(pair);
  conv.scrollTop = 0;

  const bubble = document.getElementById('consensus-bubble');
  let fullText = '';
  for await (const chunk of makeGen(svcId, messages, cfg)) {
    fullText += chunk;
    bubble.innerHTML = renderMarkdown(fullText);
    conv.scrollTop = 0;
  }
  if (!fullText) bubble.textContent = '(no response)';
  else highlightBubble(bubble);
  return fullText;
}

function showConsensusStatic(text, isError = false) {
  const conv  = document.getElementById('conv_consensus');
  const empty = document.getElementById('empty_consensus');
  if (empty) empty.remove();
  const safe = lastBroadcastPrompt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  const pair = document.createElement('div');
  pair.className = 'qa-pair';
  pair.innerHTML = `
    <div class="msg user"><span class="msg-label">You</span><div class="msg-bubble">${safe}</div></div>
    <div class="msg assistant">
      <span class="msg-label">Consensus</span>
      <div class="msg-bubble">${isError ? `<span class="msg-error">${text}</span>` : renderMarkdown(text)}</div>
    </div>`;
  conv.prepend(pair); conv.scrollTop = 0;
  if (!isError) highlightBubble(pair);
}

// ── Consensus orchestration ───────────────────────────────────────────
async function runConsensus(step1Promise = null) {
  const ordered = completionOrder.filter(id => broadcastResults[id]);

  if (ordered.length === 0) {
    showConsensusStatic('All models failed to respond — no consensus available.', true);
    return;
  }
  if (ordered.length === 1) {
    showConsensusStatic(broadcastResults[ordered[0]]);
    return;
  }

  const [first, second, third] = ordered;

  const step1Messages = [
    { role: 'user',      content: lastBroadcastPrompt },
    { role: 'assistant', content: broadcastResults[first] },
    { role: 'user',      content: `Here is an additional perspective on this question:\n\n---\n${broadcastResults[second]}\n---\n\nBased on everything you know, provide the most complete and accurate answer possible.` },
  ];

  if (!third) {
    setConsensusStatus('Synthesizing…');
    setConsensusTabStep(`${SVC[first].tabLabel} + ${SVC[second].tabLabel}`);
    try { await streamToConsensusTab(first, step1Messages); }
    catch { showConsensusStatic(broadcastResults[first]); }
    return;
  }

  setConsensusStatus('Reviewing perspectives…');

  let synthesis = broadcastResults[first];
  try {
    synthesis = step1Promise ? await step1Promise : await getSilentText(first, step1Messages);
  } catch { /* use fallback */ }

  setConsensusStatus('Finalizing consensus…');
  setConsensusTabStep(`${SVC[third].tabLabel} finalizing`);

  const step2Messages = [
    { role: 'user',      content: lastBroadcastPrompt },
    { role: 'assistant', content: broadcastResults[third] },
    { role: 'user',      content: `Here is a well-researched draft answer to this question:\n\n---\n${synthesis}\n---\n\nUsing your own knowledge alongside this, provide the definitive best answer — complete, accurate, and well-organised.` },
  ];

  try { await streamToConsensusTab(third, step2Messages); }
  catch { showConsensusStatic(synthesis); }
}

// ── Open in service ───────────────────────────────────────────────────
function openInService(svcId) {
  const conv = convos[svcId];
  if (!conv.length) { toast('No conversation yet — send a prompt first'); return; }
  const svc        = SVC[svcId];
  const lastPrompt = [...conv].reverse().find(m => m.role === 'user')?.content ?? '';
  const summary    = conv.map(m => `${m.role === 'user' ? 'You' : svc.name}:\n${m.content}`).join('\n\n---\n\n');
  let url = svc.openUrl;
  if (svcId === 'claude' || svcId === 'gemini') url += '?q=' + encodeURIComponent(lastPrompt);
  navigator.clipboard.writeText(summary)
    .then(() => toast(`Conversation copied — opening ${svc.name}…`, 3500))
    .catch(() => toast(`Opening ${svc.name}…`));
  window.open(url, '_blank');
}

// ── Config modal ──────────────────────────────────────────────────────
function openConfig() {
  const c = loadCfg();
  document.getElementById('claudeKey').value   = c.claude_key  || '';
  document.getElementById('geminiKey').value   = c.gemini_key  || '';
  document.getElementById('openaiKey').value   = c.openai_key  || '';
  document.getElementById('claudeModel').value = c.claudeModel || 'claude-opus-4-8';
  document.getElementById('geminiModel').value = c.geminiModel || 'gemini-3.5-flash';
  document.getElementById('openaiModel').value = c.openaiModel || 'gpt-5.5';
  document.getElementById('configModal').classList.add('open');
}
function closeConfig() { document.getElementById('configModal').classList.remove('open'); }

document.getElementById('configBtn').addEventListener('click', openConfig);
document.getElementById('closeConfig').addEventListener('click', closeConfig);
document.getElementById('cancelConfig').addEventListener('click', closeConfig);
document.getElementById('configModal').addEventListener('click', e => {
  if (e.target === document.getElementById('configModal')) closeConfig();
});

document.getElementById('saveConfig').addEventListener('click', () => {
  const c = {
    claude_key:  document.getElementById('claudeKey').value.trim(),
    gemini_key:  document.getElementById('geminiKey').value.trim(),
    openai_key:  document.getElementById('openaiKey').value.trim(),
    claudeModel: document.getElementById('claudeModel').value,
    geminiModel: document.getElementById('geminiModel').value,
    openaiModel: document.getElementById('openaiModel').value,
  };
  Object.keys(c).forEach(k => { if (!c[k]) delete c[k]; });
  saveCfg(c); closeConfig(); refreshStatus(); toast('Configuration saved');
  // Sync tab model labels
  activeServices().forEach(id => {
    const el = document.getElementById('tmodel_' + id);
    if (el) el.textContent = modelShort(id, c[id + 'Model'] || MODEL_OPTIONS[id][0].value);
    const ts = document.querySelector(`#tab_${id} .tab-model-select`);
    if (ts) ts.value = c[id + 'Model'] || MODEL_OPTIONS[id][0].value;
  });
});

document.getElementById('clearConfig').addEventListener('click', () => {
  if (!confirm('Remove all saved API keys?')) return;
  localStorage.removeItem('polychat_v2');
  ['claudeKey','geminiKey','openaiKey'].forEach(id => document.getElementById(id).value = '');
  closeConfig(); refreshStatus(); toast('Keys cleared');
});

// ── Reset button ──────────────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', () => {
  if (completionOrder.length || Object.keys(broadcastResults).length) {
    if (!confirm('Start a new chat? This clears all current responses.')) return;
  }
  resetApp();
});

// ── Send / keyboard ───────────────────────────────────────────────────
document.getElementById('sendBtn').addEventListener('click', sendAll);
document.getElementById('promptInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendAll(); }
});
document.getElementById('promptInput').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 260) + 'px';
});

// ── Theme ─────────────────────────────────────────────────────────────
const SUN_SVG  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const MOON_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('polychat_theme', t);
  document.getElementById('themeBtn').innerHTML = t === 'dark' ? SUN_SVG : MOON_SVG;
  const l = document.getElementById('hljs-theme');
  if (l) l.disabled = (t === 'light');
}
document.getElementById('themeBtn').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

// ── Init ──────────────────────────────────────────────────────────────
if (typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true });
applyTheme(localStorage.getItem('polychat_theme') || 'dark');
refreshStatus();
if (!activeServices().length) setTimeout(openConfig, 400);
</script>
</body>
</html>
